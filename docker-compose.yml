# 1 controller + 4 workers, each with its own named volume.
#
#   docker compose up -d --build      build the image and start everything
#   docker compose logs -f controller watch failure detection / repair
#   docker stop worker2               simulate a worker failure   (Phase 5)
#   docker start worker2              bring it back               (Phase 6)
#   docker compose down               stop (volumes are kept)
#   docker compose down -v            stop AND wipe all stored data
#
# Inside the compose network, services reach each other by name
# (http://controller:9000, http://worker2:8081). From the host, use
# http://localhost:9000 (controller) or localhost:8081-8084 (workers).

name: distributed-object-store

# Settings shared by every worker (YAML anchor, merged with <<: below).
x-worker: &worker
  image: distributed-object-store:latest
  command: ["worker"]
  restart: unless-stopped
  depends_on:
    - controller
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8081/health"]
    interval: 5s
    timeout: 2s
    retries: 3

services:
  controller:
    build: .
    image: distributed-object-store:latest
    container_name: controller
    command: ["controller"]
    restart: unless-stopped
    environment:
      PORT: "9000"
      DATA_DIR: /data
      MAX_UPLOAD_MB: "1024"
      RUST_LOG: info
    ports:
      - "9000:9000"
    volumes:
      - controller-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 2s
      retries: 3

  worker1:
    <<: *worker
    container_name: worker1
    environment:
      WORKER_ID: worker1
      PORT: "8081"
      ADVERTISE_ADDR: http://worker1:8081
      CONTROLLER_URL: http://controller:9000
      DATA_DIR: /data
      RUST_LOG: info
    ports:
      - "8081:8081"
    volumes:
      - worker1-data:/data

  worker2:
    <<: *worker
    container_name: worker2
    environment:
      WORKER_ID: worker2
      PORT: "8081"
      ADVERTISE_ADDR: http://worker2:8081
      CONTROLLER_URL: http://controller:9000
      DATA_DIR: /data
      RUST_LOG: info
    ports:
      - "8082:8081"
    volumes:
      - worker2-data:/data

  worker3:
    <<: *worker
    container_name: worker3
    environment:
      WORKER_ID: worker3
      PORT: "8081"
      ADVERTISE_ADDR: http://worker3:8081
      CONTROLLER_URL: http://controller:9000
      DATA_DIR: /data
      RUST_LOG: info
    ports:
      - "8083:8081"
    volumes:
      - worker3-data:/data

  worker4:
    <<: *worker
    container_name: worker4
    environment:
      WORKER_ID: worker4
      PORT: "8081"
      ADVERTISE_ADDR: http://worker4:8081
      CONTROLLER_URL: http://controller:9000
      DATA_DIR: /data
      RUST_LOG: info
    ports:
      - "8084:8081"
    volumes:
      - worker4-data:/data

volumes:
  controller-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:
